# Throwaway experiment. Not part of the build; delete the branch when the answer is in.
#
# Run 31004829159 answered the previous question: cesium-native's 22 libraries and its 28 vcpkg
# dependencies build for wasm at Emscripten 3.1.56 without -pthread and without
# -fwasm-exceptions. Three legs, identical results.
#
# This asks the next one, which that run deliberately did not cover: does *CesiumNativeC* link.
# It is a different question for two reasons.
#
#   1. CesiumC's dependency set is strictly larger. vcpkg.json adds libjpeg-turbo, cpp-httplib,
#      blend2d, ms-gsl and doctest on top of what cesium-native pulls. Any one of those could be
#      the real wasm blocker, and none of them was exercised by the previous run.
#   2. Linking an executable is a stronger test than producing archives. The test target links
#      CesiumNativeC into a real binary, so an unresolved symbol shows up here and cannot show
#      up in a build that only creates .a files.
#
# The changes on this branch that make it possible at all:
#   - AssetAccessorWrapper holds CesiumAsync::IAssetAccessor rather than
#     CesiumCurl::CurlAssetAccessor, which is what every consumer already needed
#   - CesiumCurl is linked only when NOT EMSCRIPTEN, and curl is guarded platform=!wasm32
#   - a placeholder accessor that fails every request with status 0, so the symbol exists
#   - CesiumNativeC builds STATIC on Emscripten, because .NET's browser-wasm links archives
#
# Flags: the "bare" set, which the previous run proved sufficient and which is what ImGui.Net
# uses -- the configuration already known to link into a .NET wasm app.

name: Experiment - does CesiumNativeC link for wasm

on:
  push:
    branches:
      - 'experiment/**'
  workflow_dispatch:

env:
  # Same directory the normal build uses. The wasm triplet is written into it at run time,
  # copied from cesium-native's, so there is only ever one overlay path to declare.
  VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets

jobs:
  wasm:
    name: wasm32-emscripten
    runs-on: windows-2022
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"

      - name: Install nasm
        uses: ilammy/setup-nasm@v1

      - name: Setup emsdk 3.1.56
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      - name: Verify the compiler
        run: emcc -v

      # Written at run time rather than committed, so this branch carries no triplet that could
      # outlive the experiment. printf rather than a heredoc: a heredoc body inside a YAML block
      # scalar cannot start at column 0, and its terminator cannot be indented, so those two
      # constraints contradict each other.
      - name: Write the experiment triplet
        shell: bash
        run: |
          set -euo pipefail
          src=cesium-native/extern/vcpkg/triplets/wasm32-emscripten-cesium.cmake
          dst=triplets/wasm32-emscripten-exp.cmake
          grep -vE '^set\(_configureFlags|^set\(VCPKG_CMAKE_CONFIGURE_OPTIONS' "$src" > "$dst"
          printf 'set(_configureFlags "-DSIZEOF_SIZE_T=4")\n' >> "$dst"
          printf 'set(VCPKG_CMAKE_CONFIGURE_OPTIONS -DCMAKE_C_FLAGS=${_configureFlags} -DCMAKE_CXX_FLAGS=${_configureFlags} -DCMAKE_EXE_LINKER_FLAGS=${_configureFlags})\n' >> "$dst"
          printf '\nif(PORT MATCHES "openssl")\n  set(VCPKG_CONFIGURE_MAKE_OPTIONS "no-dso")\nendif()\n' >> "$dst"
          echo '--- triplet in use ---'
          cat "$dst"

      # ada-url needs the overlay port from vcpkg 2025.02.14 on Emscripten below 4.x. Lifted
      # from cesium-native's own 3.1.39 leg; 3.1.56 is in the same pre-4.x family. It lands in
      # cesium-native/extern/vcpkg/ports, which vcpkg-configuration.json already declares as an
      # overlay, so no configuration change is needed.
      - name: Overlay port for ada-url
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          clean: false
          ref: 2025.02.14
          path: vcpkg-overlay-temp
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ports/ada-url

      - name: Move the overlay port into place
        shell: bash
        run: mv vcpkg-overlay-temp/ports/* cesium-native/extern/vcpkg/ports/

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 62159a45e18f3a9ac0548628dcaf74fcb60c6ff9

      # --allow-unsupported is for blend2d, and it is narrower than it sounds.
      #
      # The port declares Supports: !wasm32. Manifest mode treats that as an error; classic mode
      # only warns -- which is why cesium-native's own Emscripten CI never hits it: under its own
      # build it uses ezvcpkg (classic), and CESIUM_USE_EZVCPKG defaults OFF precisely when a
      # parent supplies vcpkg.cmake, as this project does. So the same dependency set is strict
      # here and lax there.
      #
      # Not taken on faith: run 31004829159 installed blend2d[core] for wasm32-emscripten and it
      # built. The Supports field is upstream vcpkg's blanket statement about the port including
      # its jit feature; cesium-native asks for [core] exactly because wasm has no jit. So this
      # allows something already observed to work rather than overriding a real incompatibility.
      #
      # If this experiment leads to a supported wasm build, the durable fix is an overlay port
      # that relaxes Supports for the core feature, not a blanket flag.
      # VCPKG_CHAINLOAD_TOOLCHAIN_FILE has to be passed here, on the command line, and that is
      # the whole fix for run 31018673222.
      #
      # The triplet already sets it, but a triplet governs how vcpkg builds *ports*. For the
      # consuming project, CMAKE_TOOLCHAIN_FILE is vcpkg.cmake and nothing chainloaded
      # Emscripten's toolchain into it -- so all 32 dependencies built correctly as wasm32 while
      # our own configure ran as native x64 Windows. It failed at:
      #
      #   Could not find a configuration file for package "ada" ...
      #     .../share/ada/ada-config.cmake, version: 2.9.2 (32bit)
      #
      # "(32bit)" is CMake's annotation for a package rejected on pointer size. The package was
      # right; the consumer was 64-bit. Passing the chainload explicitly is the documented way to
      # combine vcpkg with Emscripten.
      #
      # It also means EMSCRIPTEN was not defined in that run, so CesiumC's own
      # `if(EMSCRIPTEN) set(CESIUM_TARGET_WASM ON) ...` never fired either. One missing argument,
      # two silent wrong turns -- which is why the check below now runs even on failure.
      - name: Configure
        shell: pwsh
        run: |
          $emscriptenToolchain = "$env:EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake"
          if (-not (Test-Path $emscriptenToolchain)) {
            throw "Emscripten toolchain not found at $emscriptenToolchain"
          }
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$emscriptenToolchain" `
            -DVCPKG_TARGET_TRIPLET=wasm32-emscripten-exp `
            -DVCPKG_INSTALL_OPTIONS=--allow-unsupported `
            -DCMAKE_CROSSCOMPILING_EMULATOR="$env:EMSDK_NODE" `
            -DCMAKE_CXX_FLAGS=-DSIZEOF_SIZE_T=4 `
            -DCMAKE_C_FLAGS=-DSIZEOF_SIZE_T=4 `
            -DCMAKE_BUILD_TYPE=Release

      # Runs even when Configure fails, which is the point. In run 31018673222 this step was
      # skipped, so a 25-minute run reported "ada not found" and said nothing about the two
      # things that actually explained it: the project was 64-bit and EMSCRIPTEN was undefined.
      #
      # CMAKE_SIZEOF_VOID_P is the load-bearing line. 4 means the Emscripten toolchain reached
      # our project; 8 means it did not, and every find_package that follows is comparing a
      # 64-bit consumer against 32-bit packages.
      # Reports; never fails. The previous version did fail, and taught the obvious lesson the
      # hard way: it grepped CMakeCache.txt for CMAKE_SIZEOF_VOID_P, EMSCRIPTEN and
      # CESIUM_TARGET_WASM, none of which are cache variables. grep found nothing, GitHub's bash
      # runs with -e, and the step died on its first iteration without printing a line -- so a
      # run whose Configure had finally *succeeded* reported failure and showed no values at all.
      # The three interesting variables are printed by CesiumC's CMakeLists instead, where they
      # exist; this step covers the cached ones and the CesiumCurl directory.
      - name: Confirm the wasm configuration took effect
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f build/CMakeCache.txt ]; then
            echo "No CMakeCache.txt -- configure did not get far enough to write one."
            exit 0
          fi
          for var in CESIUM_DISABLE_CURL CESIUM_USE_EZVCPKG VCPKG_MANIFEST_MODE VCPKG_TARGET_TRIPLET; do
            value=$(grep -E "^${var}(:[A-Z]+)?=" build/CMakeCache.txt 2>/dev/null | head -1 | cut -d= -f2- || true)
            printf '%-22s = %s\n' "$var" "${value:-(not a cache variable)}"
          done
          echo "--- pointer size and wasm flags, as CMake reported them ---"
          grep -E "CesiumNativeC: system=" build/CMakeFiles/CMakeConfigureLog.yaml 2>/dev/null || true
          echo "--- CesiumCurl target configured? ---"
          if [ -d build/cesium-native/CesiumCurl ]; then
            echo "PRESENT -- curl was not disabled, which is wrong for wasm"
          else
            echo "absent, as expected"
          fi

      # The library first, on its own, so a failure here is unambiguously "the wrapper does not
      # compile for wasm" rather than anything about the test binary.
      - name: Build the library
        run: cmake --build build --target CesiumNativeC --parallel

      # Then the executable. This is the step that answers the real question: an archive can be
      # produced with unresolved references, a linked binary cannot.
      - name: Link the test executable
        run: cmake --build build --target CesiumNativeCTests --parallel

      # And run it under node, which emcmake wires up as the crosscompiling emulator. The tests
      # are offline (no Ion token), so a pass here means the wrapper actually starts in a wasm
      # runtime rather than merely linking.
      - name: Run the tests under node
        env:
          CESIUM_ION_TOKEN: ""
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: What came out
        if: always()
        shell: bash
        run: |
          {
            echo "### CesiumNativeC for wasm32-emscripten"
            echo
            if [ -d build ]; then
              echo '```'
              find build -maxdepth 3 \( -name 'libCesiumNativeC.a' -o -name 'CesiumNativeCTests*' \) \
                -printf '%p  %s bytes\n' 2>/dev/null | sort
              echo '```'
            else
              echo "No build directory -- configure did not get that far."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
