# Named "CI" rather than "Build" so ci-doctor can see it. That agent triggers on
# `workflow_run` filtered to workflows literally named "CI", "CD" or "Sync standards", so a
# repository whose build is called anything else gets an agent that is installed, compiles,
# and can never fire. JoltPhysicsC has exactly that today -- its workflow is called
# "Build JoltC Libraries" and ci-doctor has zero runs there.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release-tag:
        description: >-
          Publish a release at this tag with the seven libraries attached, e.g. v0.61.0.
          Leave empty to build and test only. Use the cesium-native version this wrapper
          targets, so the tag answers "which Cesium is this?" without chasing a submodule.
        required: false
        type: string
        default: ''

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN needs packages:write to push to the GitHub Packages NuGet feed
# used as the vcpkg binary cache. On pull requests from forks this is
# automatically downgraded to read-only.
permissions:
  contents: read
  packages: write

env:
  CMAKE_BUILD_TYPE: Release
  # Release-only dependency builds: these overlay triplets override the built-in
  # ones (same names) and set VCPKG_BUILD_TYPE=release, so vcpkg skips Debug.
  VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
  # GitHub Packages NuGet feed used as the vcpkg binary cache (owner-scoped).
  NUGET_FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
            triplet: x64-windows
            generator: "Visual Studio 17 2022"
            cmake-arch: "-A x64"
            artifact: windows-x64
            rid: win-x64
            osx-architectures: ""
            bin-path: build/bin/Release/*.dll
            lib-path: build/lib/Release/CesiumNativeC.*
            skip-tests: false

          - os: windows-2022
            arch: arm64
            triplet: arm64-windows
            generator: "Visual Studio 17 2022"
            cmake-arch: "-A ARM64"
            artifact: windows-arm64
            rid: win-arm64
            osx-architectures: ""
            bin-path: build/bin/Release/*.dll
            lib-path: build/lib/Release/CesiumNativeC.*
            skip-tests: true  # cross-compiled, can't run on x64

          # Enabled 2026-08. These two were commented out in dc951ec, the very first commit, and
          # never tried since -- there is no recorded failure behind them, only "need a lot of
          # testing" in that commit message.
          - os: ubuntu-latest
            arch: x64
            triplet: x64-linux
            generator: Ninja
            cmake-arch: ""
            artifact: linux-x64
            rid: linux-x64
            osx-architectures: ""
            bin-path: build/bin/
            lib-path: build/lib/libCesiumNativeC.*
            skip-tests: false

          # A native arm64 runner rather than a cross-compile from x64. Cross-compiling would
          # mean an aarch64 toolchain for all thirty vcpkg dependencies; here there is none to
          # arrange, and the tests actually run.
          - os: ubuntu-24.04-arm
            arch: arm64
            triplet: arm64-linux
            generator: Ninja
            cmake-arch: ""
            artifact: linux-arm64
            rid: linux-arm64
            osx-architectures: ""
            bin-path: build/bin/
            lib-path: build/lib/libCesiumNativeC.*
            skip-tests: false

          - os: macos-14
            arch: arm64
            triplet: arm64-osx
            generator: Ninja
            cmake-arch: ""
            artifact: osx-arm64
            rid: osx-arm64
            osx-architectures: "arm64"
            bin-path: build/bin/
            lib-path: build/lib/libCesiumNativeC.*
            skip-tests: false

          # Intel macOS, cross-compiled from the arm64 runner. Apple's clang targets both
          # architectures from either host, so this needs no special toolchain -- only a triplet
          # that says x86_64. GitHub's Intel macOS runners are on their way out, so depending on
          # one would be building a dependency with an expiry date.
          - os: macos-14
            arch: x64
            triplet: x64-osx
            generator: Ninja
            cmake-arch: ""
            artifact: osx-x64
            rid: osx-x64
            osx-architectures: "x86_64"
            bin-path: build/bin/
            lib-path: build/lib/libCesiumNativeC.*
            skip-tests: true  # cross-compiled, cannot run on arm64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # ---- Install platform tools ----

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm pkg-config mono-complete

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja nasm mono

      # ---- vcpkg ----

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 62159a45e18f3a9ac0548628dcaf74fcb60c6ff9

      # ---- vcpkg binary cache (GitHub Packages NuGet feed) ----
      # The cache is writable only on main (to warm it); every other ref reads
      # it but never writes, so PRs can't evict shared entries. If VCPKG_PAT_TOKEN
      # (a PAT with packages:read/write) is configured it is preferred, otherwise
      # the built-in GITHUB_TOKEN is used.

      - name: Set up NuGet binary cache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NUGET_TOKEN: ${{ secrets.VCPKG_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $mode = if ($env:GITHUB_REF -eq 'refs/heads/main') { 'readwrite' } else { 'read' }
          "VCPKG_BINARY_SOURCES=clear;nuget,$($env:NUGET_FEED_URL),$mode" | Out-File -FilePath $env:GITHUB_ENV -Append
          $fetchOut = & "$env:VCPKG_ROOT/vcpkg.exe" fetch nuget
          Write-Host "vcpkg fetch nuget output:`n$($fetchOut -join "`n")"
          $nuget = ($fetchOut | Where-Object { $_.Trim() } | Select-Object -Last 1).Trim()
          if (-not $nuget) { throw "Could not resolve nuget path from 'vcpkg fetch nuget'." }
          Write-Host "Resolved nuget: $nuget"
          & $nuget sources add -Source "$env:NUGET_FEED_URL" -StorePasswordInClearText -Name GitHubPackages -UserName "$env:GITHUB_REPOSITORY_OWNER" -Password "$env:NUGET_TOKEN"
          & $nuget setapikey "$env:NUGET_TOKEN" -Source "$env:NUGET_FEED_URL"

      # Best-effort, and deliberately so. A cache that cannot be reached should cost build time,
      # not a build: on ubuntu-24.04-arm `vcpkg fetch nuget` exits non-zero and prints nothing,
      # and because this ran under `-e` the whole leg died on its first command with no
      # explanation at all. VCPKG_BINARY_SOURCES is now written only once nuget is actually
      # usable, so failing here leaves vcpkg building from source rather than pointing at a feed
      # it cannot talk to.
      - name: Set up NuGet binary cache (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          NUGET_TOKEN: ${{ secrets.VCPKG_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then mode=readwrite; else mode=read; fi

          fetch_out="$("$VCPKG_ROOT/vcpkg" fetch nuget 2>&1)"
          if [ $? -ne 0 ]; then
            echo "::warning::'vcpkg fetch nuget' failed on this platform; building without a binary cache."
            echo "$fetch_out"
            exit 0
          fi
          echo "vcpkg fetch nuget output:"
          echo "$fetch_out"

          nuget_path="$(printf '%s\n' "$fetch_out" | grep -v '^[[:space:]]*$' | tail -n 1)"
          if [ -z "$nuget_path" ] || [ ! -e "$nuget_path" ]; then
            echo "::warning::could not resolve a nuget executable; building without a binary cache."
            exit 0
          fi
          echo "Resolved nuget: $nuget_path"

          # vcpkg may return its own nuget.exe (run via mono) or a system nuget
          # launcher script (e.g. mono's), which must be executed directly.
          case "$nuget_path" in
            *.exe) nuget=(mono "$nuget_path") ;;
            *)     nuget=("$nuget_path") ;;
          esac

          if ! "${nuget[@]}" sources add -Source "$NUGET_FEED_URL" -StorePasswordInClearText -Name GitHubPackages -UserName "$GITHUB_REPOSITORY_OWNER" -Password "$NUGET_TOKEN"; then
            echo "::warning::could not register the NuGet source; building without a binary cache."
            exit 0
          fi
          "${nuget[@]}" setapikey "$NUGET_TOKEN" -Source "$NUGET_FEED_URL" || true

          echo "VCPKG_BINARY_SOURCES=clear;nuget,${NUGET_FEED_URL},${mode}" >> "$GITHUB_ENV"
          echo "binary cache enabled in $mode mode"

      # ---- Build ----

      # CMAKE_OSX_ARCHITECTURES has to be passed here, not left to the triplet. A triplet governs
      # how vcpkg builds ports; the consuming project is configured by these arguments alone. The
      # first osx-x64 run showed exactly that split: vcpkg produced x86_64 dependencies in
      # vcpkg_installed/x64-osx, and CMake then linked them with `-arch arm64` because the runner
      # is arm64 and nothing had said otherwise. Empty on every non-Apple leg, where CMake ignores
      # it.
      - name: CMake configure
        run: >
          cmake -S . -B build
          -G "${{ matrix.generator }}" ${{ matrix.cmake-arch }}
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx-architectures }}
          -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

      - name: CMake build
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }} --parallel

      # ---- Test ----

      - name: Run tests
        if: ${{ !matrix.skip-tests }}
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }} --target CesiumNativeCTests --parallel && ctest --test-dir build --build-config ${{ env.CMAKE_BUILD_TYPE }} --output-on-failure --no-tests=error
        env:
          # Offline tests only in CI — no Ion token
          CESIUM_ION_TOKEN: ""

      # ---- Upload ----

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CesiumNativeC-${{ matrix.artifact }}
          path: |
            ${{ matrix.bin-path }}
            ${{ matrix.lib-path }}
          if-no-files-found: error

  # A separate job rather than a matrix row: this needs emsdk, a patch applied to the submodule,
  # a different vcpkg invocation and a different artifact shape, and threading those through the
  # desktop matrix with `if:` on half the steps would make both harder to read.
  wasm:
    name: browser-wasm
    runs-on: windows-2022
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # cesium-native puts -pthread and -fwasm-exceptions on every wasm compile, from a single
      # if(CESIUM_TARGET_WASM) block with no way to opt out. Both are all-or-nothing across a
      # link, and .NET's browser-wasm uses neither, so an archive carrying them is one no .NET
      # app can link. The patch gates them behind an option that defaults to ON, so it changes
      # nothing for anyone else -- it is written in the shape a pull request to cesium-native
      # would take, so that if upstream accepts it this file is deleted and the option is passed
      # instead.
      #
      # --check first, so a submodule bump that moves those lines fails here saying so, rather
      # than applying half a patch or silently doing nothing.
      - name: Patch cesium-native for a single-threaded wasm build
        shell: bash
        run: |
          set -euo pipefail
          patch=$PWD/patches/cesium-native-wasm-shared-memory-option.patch
          git -C cesium-native apply --check "$patch"
          git -C cesium-native apply "$patch"
          echo "applied $(basename "$patch")"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"

      - name: Install nasm
        uses: ilammy/setup-nasm@v1

      # The version dotnet/emsdk pins for .NET 10. Matching it is the whole point: a native
      # archive has to be linkable by the runtime that will consume it.
      - name: Setup emsdk 3.1.56
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      # ada-url needs the port from vcpkg 2025.02.14 on Emscripten below 4.x. It lands in
      # cesium-native/extern/vcpkg/ports, which vcpkg-configuration.json already declares as an
      # overlay, so no configuration change goes with it.
      - name: Overlay port for ada-url
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          clean: false
          ref: 2025.02.14
          path: vcpkg-overlay-temp
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ports/ada-url

      - name: Move the overlay port into place
        shell: bash
        run: mv vcpkg-overlay-temp/ports/* cesium-native/extern/vcpkg/ports/

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 62159a45e18f3a9ac0548628dcaf74fcb60c6ff9

      # VCPKG_CHAINLOAD_TOOLCHAIN_FILE goes on the command line, not just in the triplet. A
      # triplet governs how vcpkg builds ports; without this the dependencies come out wasm32
      # and this project configures as native x64, and the first symptom is find_package
      # rejecting a package for its pointer size -- which reads as a missing package.
      #
      # --allow-unsupported is for blend2d, whose port declares Supports: !wasm32. Manifest mode
      # treats that as an error and classic mode only warns, which is why cesium-native's own
      # Emscripten CI never meets it. blend2d[core] does build for wasm; the Supports field is a
      # blanket statement about the port including its jit feature, and cesium-native asks for
      # [core] precisely because wasm has no jit.
      - name: CMake configure
        shell: pwsh
        run: |
          $emscriptenToolchain = "$env:EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake"
          if (-not (Test-Path $emscriptenToolchain)) {
            throw "Emscripten toolchain not found at $emscriptenToolchain"
          }
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$emscriptenToolchain" `
            -DVCPKG_TARGET_TRIPLET=wasm32-emscripten `
            -DVCPKG_INSTALL_OPTIONS=--allow-unsupported `
            -DCMAKE_CROSSCOMPILING_EMULATOR="$env:EMSDK_NODE" `
            -DCESIUM_WASM_SHARED_MEMORY=OFF `
            -DCMAKE_CXX_FLAGS=-DSIZEOF_SIZE_T=4 `
            -DCMAKE_C_FLAGS=-DSIZEOF_SIZE_T=4 `
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

      - name: CMake build
        run: cmake --build build --target CesiumNativeC --parallel

      - name: Run tests under node
        env:
          CESIUM_ION_TOKEN: ""
        run: cmake --build build --target CesiumNativeCTests --parallel && ctest --test-dir build --output-on-failure --no-tests=error

      # The check that says whether the archive is usable rather than merely built. ImGui.Net's
      # cimgui.a and Evergine's ktx.a -- the natives that link into a .NET wasm app today --
      # contain none of these symbols. A non-zero count means this archive demands the wasm
      # exception runtime, and every consumer would have to enable -fwasm-exceptions to link it.
      # An undefined symbol's name has to appear as a string in the object that needs it, which
      # is what makes counting them meaningful without a symbol dumper on the runner.
      - name: Verify the archive is single-threaded and free of wasm exceptions
        shell: bash
        run: |
          set -euo pipefail
          archive=build/lib/libCesiumNativeC.a
          test -f "$archive" || { echo "::error::$archive was not produced"; exit 1; }
          echo "archive: $archive ($(stat -c%s "$archive") bytes)"
          failed=0
          for sym in __cpp_exception __wasm_lpad_context _Unwind_CallPersonality pthread_create; do
            count=$(grep -ac "$sym" "$archive" || true)
            printf '  %-26s %s\n' "$sym" "$count"
            if [ "$count" != "0" ]; then
              echo "::error::$archive references $sym; a .NET wasm app cannot link it as-is"
              failed=1
            fi
          done
          exit $failed

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CesiumNativeC-browser-wasm
          path: build/lib/libCesiumNativeC.a
          if-no-files-found: error

  # ── Release ─────────────────────────────────────────────────────────────
  # Artifacts expire after 90 days; release assets do not. Without this, the only way a
  # binary reaches Cesium.NET is somebody downloading it by hand, and nothing records which
  # revision it came from -- which is exactly how that repository ended up with three RIDs
  # and no account of where they came from.
  release:
    needs: [build, wasm]
    if: inputs.release-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Collect the built libraries
        uses: actions/download-artifact@v5
        with:
          pattern: CesiumNativeC-*
          path: assets

      # Each archive holds runtimes/<rid>/native/, so a consumer unpacks it over its tree and
      # is done.
      #
      # The per-platform file selection is explicit rather than a copy of everything, for two
      # reasons. The Linux and macOS artifacts also contain CesiumNativeCTests, the test
      # executable, which has no business in a package. And "copy whatever is there" cannot
      # tell the difference between a platform that shipped its library and one that shipped
      # only a stray file, so it would happily publish the second.
      - name: Pack one archive per runtime identifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          shopt -s nullglob

          pack() {
            local artifact=$1 rid=$2 subdir=$3 pattern=$4 required=$5
            local src="assets/CesiumNativeC-$artifact/$subdir"
            local dest="staging/$rid/runtimes/$rid/native"

            # Matches collected and filtered to what exists, so an empty match is reported as
            # what it is. Letting `cp` discover it produces "cannot stat" or "missing
            # destination file operand" depending on whether the pattern was a glob, and
            # neither says which platform failed. Filtering by existence rather than relying on
            # nullglob because half these patterns are literal filenames, which nullglob leaves
            # in the array whether the file is there or not.
            local matches=() candidate
            for candidate in $src$pattern; do
              [ -e "$candidate" ] && matches+=("$candidate")
            done
            if [ ${#matches[@]} -eq 0 ]; then
              echo "::error::$rid: nothing matched $src$pattern -- the $artifact build produced no library"
              exit 1
            fi

            mkdir -p "$dest"
            cp "${matches[@]}" "$dest/"

            if [ ! -f "$dest/$required" ]; then
              echo "::error::$rid: $required not found among $(ls "$dest" | tr '\n' ' ')"
              exit 1
            fi

            ( cd "staging/$rid" && zip -qr "$GITHUB_WORKSPACE/release/cesiumnativec-$rid.zip" runtimes )
            echo "packed cesiumnativec-$rid.zip  ($(find "$dest" -type f | wc -l) file(s))"
          }

          # Windows links its dependencies dynamically, so the package is CesiumNativeC.dll
          # plus the nineteen it needs. Linux and macOS link everything statically into one
          # library. Both are deliberate, and the coherence checks read them the same way.
          pack windows-x64    win-x64      bin/Release/ '*.dll'                CesiumNativeC.dll
          pack windows-arm64  win-arm64    bin/Release/ '*.dll'                CesiumNativeC.dll
          pack linux-x64      linux-x64    bin/         'libCesiumNativeC.so'  libCesiumNativeC.so
          pack linux-arm64    linux-arm64  bin/         'libCesiumNativeC.so'  libCesiumNativeC.so
          pack osx-x64        osx-x64      bin/         'libCesiumNativeC.dylib' libCesiumNativeC.dylib
          pack osx-arm64      osx-arm64    bin/         'libCesiumNativeC.dylib' libCesiumNativeC.dylib
          pack browser-wasm   browser-wasm ''           'libCesiumNativeC.a'   libCesiumNativeC.a

          echo
          ls -la release/
          count=$(ls release/*.zip | wc -l)
          if [ "$count" -ne 7 ]; then
            echo "::error::expected 7 archives, got $count. A platform is missing."
            exit 1
          fi

      # The tag names the cesium-native release this wrapper targets, so it has to be the one
      # the manifest records. A release tagged v0.63.0 built from a tree pinned at v0.61.0 is
      # a lie that only shows up much later, in a consumer.
      - name: Check the tag matches what the manifest records
        shell: bash
        run: |
          set -euo pipefail
          recorded=$(python3 -c "import yaml,sys; print(((yaml.safe_load(open('binding.yml',encoding='utf-8')).get('upstream') or {}).get('release') or {}).get('current') or '')")
          echo "manifest records: $recorded"
          echo "release tag:      ${{ inputs.release-tag }}"
          if [ "$recorded" != "${{ inputs.release-tag }}" ]; then
            echo "::error::binding.yml records $recorded but this release is tagged ${{ inputs.release-tag }}."
            exit 1
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release-tag }}
          name: ${{ inputs.release-tag }}
          body: |
            CesiumNativeC wrapping cesium-native `${{ inputs.release-tag }}`.

            Seven archives, one per runtime identifier. Each contains
            `runtimes/<rid>/native/`, so unpacking it over a .NET binding repository puts the
            library where the package expects it.

            `browser-wasm` is a static archive built without `-pthread` and without
            `-fwasm-exceptions`, which is what .NET's browser-wasm can link. Its HTTP accessor
            is a placeholder that fails every request; a `fetch`-based one is still to be
            written.
          files: release/*.zip
          fail_on_unmatched_files: true
