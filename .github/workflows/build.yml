# Named "CI" rather than "Build" so ci-doctor can see it. That agent triggers on
# `workflow_run` filtered to workflows literally named "CI", "CD" or "Sync standards", so a
# repository whose build is called anything else gets an agent that is installed, compiles,
# and can never fire. JoltPhysicsC has exactly that today -- its workflow is called
# "Build JoltC Libraries" and ci-doctor has zero runs there.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release-tag:
        description: >-
          Publish a release at this tag with the nine libraries attached, e.g. v0.61.0.
          Leave empty to build and test only. Use the cesium-native version this wrapper
          targets, so the tag answers "which Cesium is this?" without chasing a submodule.
        required: false
        type: string
        default: ''

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN needs packages:write to push to the GitHub Packages NuGet feed
# used as the vcpkg binary cache. On pull requests from forks this is
# automatically downgraded to read-only.
permissions:
  contents: read
  packages: write

env:
  CMAKE_BUILD_TYPE: Release
  # Release-only dependency builds: these overlay triplets override the built-in
  # ones (same names) and set VCPKG_BUILD_TYPE=release, so vcpkg skips Debug.
  VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
  # GitHub Packages NuGet feed used as the vcpkg binary cache (owner-scoped).
  NUGET_FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
            triplet: x64-windows
            generator: "Visual Studio 17 2022"
            cmake-arch: "-A x64"
            artifact: windows-x64
            rid: win-x64
            osx-architectures: ""
            bin-path: build/bin/Release/*.dll
            lib-path: build/lib/Release/CesiumNativeC.*
            skip-tests: false
            extra-cmake: ""
            build-target: ""

          - os: windows-2022
            arch: arm64
            triplet: arm64-windows
            generator: "Visual Studio 17 2022"
            cmake-arch: "-A ARM64"
            artifact: windows-arm64
            rid: win-arm64
            osx-architectures: ""
            bin-path: build/bin/Release/*.dll
            lib-path: build/lib/Release/CesiumNativeC.*
            skip-tests: true  # cross-compiled, can't run on x64
            extra-cmake: ""
            build-target: ""

          # Enabled 2026-08. These two were commented out in dc951ec, the very first commit, and
          # never tried since -- there is no recorded failure behind them, only "need a lot of
          # testing" in that commit message.
          - os: ubuntu-latest
            arch: x64
            triplet: x64-linux
            generator: Ninja
            cmake-arch: ""
            artifact: linux-x64
            rid: linux-x64
            osx-architectures: ""
            bin-path: build/bin/
            lib-path: build/lib/libCesiumNativeC.*
            skip-tests: false
            extra-cmake: ""
            build-target: ""

          # A native arm64 runner rather than a cross-compile from x64. Cross-compiling would
          # mean an aarch64 toolchain for all thirty vcpkg dependencies; here there is none to
          # arrange, and the tests actually run.
          - os: ubuntu-24.04-arm
            arch: arm64
            triplet: arm64-linux
            generator: Ninja
            cmake-arch: ""
            artifact: linux-arm64
            rid: linux-arm64
            osx-architectures: ""
            bin-path: build/bin/
            lib-path: build/lib/libCesiumNativeC.*
            skip-tests: false
            extra-cmake: ""
            build-target: ""

          - os: macos-14
            arch: arm64
            triplet: arm64-osx
            generator: Ninja
            cmake-arch: ""
            artifact: osx-arm64
            rid: osx-arm64
            osx-architectures: "arm64"
            bin-path: build/bin/
            lib-path: build/lib/libCesiumNativeC.*
            skip-tests: false
            extra-cmake: ""
            build-target: ""

          # Added 2026-08-08. A matrix row rather than a separate job like wasm, because nothing
          # about it is exceptional: it produces an ordinary shared ELF and the only thing it
          # needs that the desktop rows do not is a toolchain file.
          #
          # arm64-android-release comes from vcpkg's community set, so unlike the six desktop
          # triplets there is no overlay here. That is the point rather than an omission: an
          # overlay *replaces* the built-in triplet instead of extending it -- the mistake the
          # wasm job records costing two runs -- and vcpkg's arm64-android sets ANDROID_ABI, a
          # make host triplet and a system version that a copy of the linux overlay would have
          # silently dropped. openssl would then have failed looking like a port that does not
          # support Android.
          #
          # 32-bit android-arm is deliberately absent: Google Play has required 64-bit since
          # 2019, and it would mean building all thirty ports again for an ABI on its way out.
          #
          # All thirty ports were built for this triplet before the row was written, rather than
          # discovering it here one failure at a time. Thirty out of thirty, openssl and blend2d
          # included.
          - os: ubuntu-latest
            arch: arm64
            triplet: arm64-android-release
            generator: Ninja
            cmake-arch: ""
            artifact: android-arm64
            rid: android-arm64
            osx-architectures: ""
            bin-path: build/bin/
            lib-path: build/lib/libCesiumNativeC.*
            # No emulator on the runner, so the C++ suite cannot run here. It runs on five other
            # legs against the same sources; what is unproven on this one is the Android build of
            # it, and that is what the .NET side has to cover.
            skip-tests: true
            # The toolchain has to reach the project, not just vcpkg. A triplet governs how vcpkg
            # builds ports; without this the dependencies come out aarch64-android and the
            # project configures as native x64, and the first symptom is find_package rejecting a
            # package -- which reads as a missing package. Exactly what the wasm job hit.
            extra-cmake: >-
              -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
              -DANDROID_ABI=arm64-v8a
              -DANDROID_PLATFORM=android-28
              -DANDROID_STL=c++_static
            build-target: ""

          # Added 2026-08-08, and unlike android these produce a *static* archive. iOS only lets
          # an application load dynamic libraries that ship inside its own bundle as frameworks,
          # and a .NET iOS application is compiled ahead of time and linked, so what a consumer
          # needs is an archive to link -- the same shape as browser-wasm and for a different
          # reason. CMakeLists.txt carries that rule.
          #
          # Two rows rather than one, and the simulator is not there for symmetry: a simulator
          # build needs no signing certificate and a device build does, so it is the only one of
          # the two that CI can put in front of a real .NET application without secrets.
          #
          # asmjit is absent on both and blend2d is built without its jit feature, which vcpkg.json
          # has said for a while -- `"platform": "!ios&!wasm32"`. iOS forbids JIT, and asmjit's
          # virtmem.cpp does not compile there at all: `use of undeclared identifier
          # 'sys_icache_invalidate'`. Nothing to do; the manifest already asks correctly.
          - os: macos-14
            arch: arm64
            triplet: arm64-ios-release
            generator: Ninja
            cmake-arch: ""
            artifact: ios-arm64
            rid: ios-arm64
            osx-architectures: "arm64"
            bin-path: build/bin/
            lib-path: build/lib/libCesiumNativeC.*
            skip-tests: true  # a device build cannot run on a runner
            extra-cmake: >-
              -DCMAKE_SYSTEM_NAME=iOS
              -DCMAKE_OSX_SYSROOT=iphoneos
              -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
            build-target: "--target CesiumNativeC"

          - os: macos-14
            arch: arm64
            triplet: arm64-ios-simulator-release
            generator: Ninja
            cmake-arch: ""
            artifact: iossimulator-arm64
            rid: iossimulator-arm64
            osx-architectures: "arm64"
            bin-path: build/bin/
            lib-path: build/lib/libCesiumNativeC.*
            skip-tests: true  # needs a booted simulator, which this workflow does not stand up
            extra-cmake: >-
              -DCMAKE_SYSTEM_NAME=iOS
              -DCMAKE_OSX_SYSROOT=iphonesimulator
              -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
            build-target: "--target CesiumNativeC"

          # Intel macOS was built here until 2026-08-08 and is not any more. Apple stopped
          # selling Intel Macs in 2023, GitHub's macos-13 runners are on their way out, and the
          # consequence was concrete rather than theoretical: it was the only one of the seven
          # identifiers that nothing had ever executed. Cross-compiled on an arm64 mac, so the
          # C++ tests skipped it, and three attempts across two days to get an Intel runner for
          # the .NET smoke test never got a machine.
          #
          # Shipping a library that no test on earth has run is worse than not shipping it.

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # ---- Install platform tools ----

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm pkg-config mono-complete

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja nasm mono

      # ---- vcpkg ----

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 62159a45e18f3a9ac0548628dcaf74fcb60c6ff9

      # ---- vcpkg binary cache (GitHub Packages NuGet feed) ----
      # The cache is writable only on main (to warm it); every other ref reads
      # it but never writes, so PRs can't evict shared entries. If VCPKG_PAT_TOKEN
      # (a PAT with packages:read/write) is configured it is preferred, otherwise
      # the built-in GITHUB_TOKEN is used.

      - name: Set up NuGet binary cache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NUGET_TOKEN: ${{ secrets.VCPKG_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $mode = if ($env:GITHUB_REF -eq 'refs/heads/main') { 'readwrite' } else { 'read' }
          "VCPKG_BINARY_SOURCES=clear;nuget,$($env:NUGET_FEED_URL),$mode" | Out-File -FilePath $env:GITHUB_ENV -Append
          $fetchOut = & "$env:VCPKG_ROOT/vcpkg.exe" fetch nuget
          Write-Host "vcpkg fetch nuget output:`n$($fetchOut -join "`n")"
          $nuget = ($fetchOut | Where-Object { $_.Trim() } | Select-Object -Last 1).Trim()
          if (-not $nuget) { throw "Could not resolve nuget path from 'vcpkg fetch nuget'." }
          Write-Host "Resolved nuget: $nuget"
          & $nuget sources add -Source "$env:NUGET_FEED_URL" -StorePasswordInClearText -Name GitHubPackages -UserName "$env:GITHUB_REPOSITORY_OWNER" -Password "$env:NUGET_TOKEN"
          & $nuget setapikey "$env:NUGET_TOKEN" -Source "$env:NUGET_FEED_URL"

      # Best-effort, and deliberately so. A cache that cannot be reached should cost build time,
      # not a build: on ubuntu-24.04-arm `vcpkg fetch nuget` exits non-zero and prints nothing,
      # and because this ran under `-e` the whole leg died on its first command with no
      # explanation at all. VCPKG_BINARY_SOURCES is now written only once nuget is actually
      # usable, so failing here leaves vcpkg building from source rather than pointing at a feed
      # it cannot talk to.
      - name: Set up NuGet binary cache (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          NUGET_TOKEN: ${{ secrets.VCPKG_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then mode=readwrite; else mode=read; fi

          fetch_out="$("$VCPKG_ROOT/vcpkg" fetch nuget 2>&1)"
          if [ $? -ne 0 ]; then
            echo "::warning::'vcpkg fetch nuget' failed on this platform; building without a binary cache."
            echo "$fetch_out"
            exit 0
          fi
          echo "vcpkg fetch nuget output:"
          echo "$fetch_out"

          nuget_path="$(printf '%s\n' "$fetch_out" | grep -v '^[[:space:]]*$' | tail -n 1)"
          if [ -z "$nuget_path" ] || [ ! -e "$nuget_path" ]; then
            echo "::warning::could not resolve a nuget executable; building without a binary cache."
            exit 0
          fi
          echo "Resolved nuget: $nuget_path"

          # vcpkg may return its own nuget.exe (run via mono) or a system nuget
          # launcher script (e.g. mono's), which must be executed directly.
          case "$nuget_path" in
            *.exe) nuget=(mono "$nuget_path") ;;
            *)     nuget=("$nuget_path") ;;
          esac

          if ! "${nuget[@]}" sources add -Source "$NUGET_FEED_URL" -StorePasswordInClearText -Name GitHubPackages -UserName "$GITHUB_REPOSITORY_OWNER" -Password "$NUGET_TOKEN"; then
            echo "::warning::could not register the NuGet source; building without a binary cache."
            exit 0
          fi
          "${nuget[@]}" setapikey "$NUGET_TOKEN" -Source "$NUGET_FEED_URL" || true

          echo "VCPKG_BINARY_SOURCES=clear;nuget,${NUGET_FEED_URL},${mode}" >> "$GITHUB_ENV"
          echo "binary cache enabled in $mode mode"

      # ---- Build ----

      # CMAKE_OSX_ARCHITECTURES has to be passed here, not left to the triplet. A triplet governs
      # how vcpkg builds ports; the consuming project is configured by these arguments alone. The
      # first osx-x64 run showed exactly that split: vcpkg produced x86_64 dependencies in
      # vcpkg_installed/x64-osx, and CMake then linked them with `-arch arm64` because the runner
      # is arm64 and nothing had said otherwise. Empty on every non-Apple leg, where CMake ignores
      # it.
      - name: CMake configure
        run: >
          cmake -S . -B build
          -G "${{ matrix.generator }}" ${{ matrix.cmake-arch }}
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx-architectures }}
          -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}
          ${{ matrix.extra-cmake }}

      # `--target` on iOS and nothing on the rest. The default builds every target, and
      # CesiumNativeCTests is an executable: on iOS that means a bundle and a signing identity,
      # neither of which exists on a runner, and the leg would fail on a test binary it is never
      # going to run. The wasm job restricts its build for the same reason.
      - name: CMake build
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }} ${{ matrix.build-target }} --parallel

      # An iOS archive that holds only this wrapper's own objects is not something a consumer can
      # link. cesium-native and every vcpkg dependency are separate archives that CMake links at
      # executable time, which is why the build succeeds while the published asset would fail
      # with thousands of undefined symbols. Desktop hides this -- the shared library resolves
      # its own dependencies -- and iOS, like browser-wasm, has nothing to resolve them with.
      #
      # libtool rather than llvm-ar's MRI script: this runs on macOS, where libtool is the tool
      # that merges archives, and -filelist keeps 139 paths off the command line.
      - name: Bundle every static library into one linkable archive
        if: startsWith(matrix.rid, 'ios')
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/lib/libCesiumNativeC-bundle.a"

          # vcpkg installs each port twice, release under lib/ and debug under debug/lib/, and a
          # plain find takes both. On the wasm leg that meant 257 archives instead of 139 and
          # 340 MB instead of 55, and it went unnoticed while the ports came from the binary
          # cache, which does not materialise the debug tree. Shipping both would also put two
          # builds of the same library in one archive and leave the consumer's linker to pick.
          find build -name '*.a' ! -path '*/debug/*' ! -name 'libCesiumNativeC-bundle.a' \
            | sort -u > archives.txt
          if grep -q '/debug/' archives.txt; then
            echo "::error::the debug tree reached the merge list; the exclusion no longer matches the layout"
            grep '/debug/' archives.txt
            exit 1
          fi
          count=$(wc -l < archives.txt)
          if [ "$count" -lt 2 ]; then
            echo "::error::found only $count archive(s); the dependency libraries are not where this expects them"
            cat archives.txt
            exit 1
          fi

          echo "merging $count archives"
          libtool -static -no_warning_for_no_symbols -filelist archives.txt -o "$bundle"

          test -f "$bundle" || { echo "::error::the merge produced no archive"; exit 1; }
          before=$(stat -f%z build/lib/libCesiumNativeC.a)
          after=$(stat -f%z "$bundle")
          awk -v b="$before" -v a="$after" -v c="$count" \
            'BEGIN{printf "  wrapper only: %.1f MB\n  bundled:      %.1f MB (from %d archives)\n", b/1e6, a/1e6, c}'

          # From here on the bundle is the archive. Everything downstream -- the upload, the
          # release asset -- has to see what a consumer will actually get.
          mv "$bundle" build/lib/libCesiumNativeC.a

      # The NDK keeps debug info where the desktop toolchains do not, and it is not a rounding
      # error. Measured on the first green android run: 251.5 MB, of which 223.7 MB is .debug_*
      # sections. What is left is 20.7 MB, slightly under linux-x64's own 25.5 MB, so the library
      # was never the problem -- but this one goes inside every APK that uses the package, and
      # 251 MB of it would not.
      #
      # --strip-debug and not --strip-all, deliberately. The coherence checks downstream read
      # exported symbols out of the library; dropping .symtab as well would save a further 7 MB
      # and put a check at risk for a rounding error.
      - name: Strip debug info
        if: matrix.rid == 'android-arm64'
        shell: bash
        run: |
          set -euo pipefail
          lib=build/bin/libCesiumNativeC.so
          strip="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          [ -x "$strip" ] || { echo "::error::no llvm-strip at $strip"; exit 1; }

          before=$(stat -c%s "$lib")
          "$strip" --strip-debug "$lib"
          after=$(stat -c%s "$lib")
          awk -v b="$before" -v a="$after" 'BEGIN{printf "  %.1f MB -> %.1f MB\n", b/1e6, a/1e6}'

          # A guard rather than a print. If a future NDK stops emitting debug info, or the strip
          # silently does nothing, this is the difference between noticing and shipping a
          # quarter of a gigabyte into somebody's application.
          if [ "$after" -gt 60000000 ]; then
            echo "::error::still $((after / 1000000)) MB after stripping; expected around 28"
            exit 1
          fi

      # ---- Test ----

      - name: Run tests
        if: ${{ !matrix.skip-tests }}
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }} --target CesiumNativeCTests --parallel && ctest --test-dir build --build-config ${{ env.CMAKE_BUILD_TYPE }} --output-on-failure --no-tests=error
        env:
          # Offline tests only in CI — no Ion token
          CESIUM_ION_TOKEN: ""

      # ---- Upload ----

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CesiumNativeC-${{ matrix.artifact }}
          path: |
            ${{ matrix.bin-path }}
            ${{ matrix.lib-path }}
          if-no-files-found: error

  # A separate job rather than a matrix row: this needs emsdk, a patch applied to the submodule,
  # a different vcpkg invocation and a different artifact shape, and threading those through the
  # desktop matrix with `if:` on half the steps would make both harder to read.
  wasm:
    name: browser-wasm
    runs-on: windows-2022
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # cesium-native puts -pthread and -fwasm-exceptions on every wasm compile, from a single
      # if(CESIUM_TARGET_WASM) block with no way to opt out. Both are all-or-nothing across a
      # link, and .NET's browser-wasm uses neither, so an archive carrying them is one no .NET
      # app can link. The patch gates them behind an option that defaults to ON, so it changes
      # nothing for anyone else -- it is written in the shape a pull request to cesium-native
      # would take, so that if upstream accepts it this file is deleted and the option is passed
      # instead.
      #
      # --check first, so a submodule bump that moves those lines fails here saying so, rather
      # than applying half a patch or silently doing nothing.
      - name: Patch cesium-native for a single-threaded wasm build
        shell: bash
        run: |
          set -euo pipefail
          patch=$PWD/patches/cesium-native-wasm-shared-memory-option.patch
          git -C cesium-native apply --check "$patch"
          git -C cesium-native apply "$patch"
          echo "applied $(basename "$patch")"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"

      - name: Install nasm
        uses: ilammy/setup-nasm@v1

      # The version dotnet/emsdk pins for .NET 10. Matching it is the whole point: a native
      # archive has to be linkable by the runtime that will consume it.
      - name: Setup emsdk 3.1.56
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      # ada-url needs the port from vcpkg 2025.02.14 on Emscripten below 4.x. It lands in
      # cesium-native/extern/vcpkg/ports, which vcpkg-configuration.json already declares as an
      # overlay, so no configuration change goes with it.
      - name: Overlay port for ada-url
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          clean: false
          ref: 2025.02.14
          path: vcpkg-overlay-temp
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ports/ada-url

      - name: Move the overlay port into place
        shell: bash
        run: mv vcpkg-overlay-temp/ports/* cesium-native/extern/vcpkg/ports/

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 62159a45e18f3a9ac0548628dcaf74fcb60c6ff9

      # VCPKG_CHAINLOAD_TOOLCHAIN_FILE goes on the command line, not just in the triplet. A
      # triplet governs how vcpkg builds ports; without this the dependencies come out wasm32
      # and this project configures as native x64, and the first symptom is find_package
      # rejecting a package for its pointer size -- which reads as a missing package.
      #
      # --allow-unsupported is for blend2d, whose port declares Supports: !wasm32. Manifest mode
      # treats that as an error and classic mode only warns, which is why cesium-native's own
      # Emscripten CI never meets it. blend2d[core] does build for wasm; the Supports field is a
      # blanket statement about the port including its jit feature, and cesium-native asks for
      # [core] precisely because wasm has no jit.
      # No overlay triplet and no ABI flags here, deliberately. Both were attempts to force the
      # vcpkg ports onto the wasm exception and setjmp models, and neither was needed: the only
      # setjmp in the whole archive came from turbojpeg, which CESIUM_DISABLE_LIBJPEG_TURBO
      # removes. The overlay triplet cost two runs of its own, because it replaces vcpkg's
      # community triplet rather than extending it and silently dropped what that one did.
      - name: CMake configure
        shell: pwsh
        run: |
          $emscriptenToolchain = "$env:EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake"
          if (-not (Test-Path $emscriptenToolchain)) {
            throw "Emscripten toolchain not found at $emscriptenToolchain"
          }
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$emscriptenToolchain" `
            -DVCPKG_TARGET_TRIPLET=wasm32-emscripten `
            -DVCPKG_INSTALL_OPTIONS=--allow-unsupported `
            -DCMAKE_CROSSCOMPILING_EMULATOR="$env:EMSDK_NODE" `
            -DCESIUM_WASM_SHARED_MEMORY=OFF `
            -DCESIUM_WASM_NONTRAPPING_FPTOINT=OFF `
            -DCMAKE_CXX_FLAGS=-DSIZEOF_SIZE_T=4 `
            -DCMAKE_C_FLAGS=-DSIZEOF_SIZE_T=4 `
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

      - name: CMake build
        run: cmake --build build --target CesiumNativeC --parallel

      - name: Run tests under node
        env:
          CESIUM_ION_TOKEN: ""
        run: cmake --build build --target CesiumNativeCTests --parallel && ctest --test-dir build --output-on-failure --no-tests=error

      # Counting symbol names as strings only means something for an archive whose members all
      # reach the link, which is true of this one -- thirteen objects, all ours -- and false of
      # the merged archive below, where most of the hundred and thirty-nine libraries contribute
      # no member at all. So this check stays here, on our own code, and the merged archive is
      # policed by an actual link instead.
      #
      # The exception symbols used to be checked here and no longer are, because the reasoning
      # behind that was wrong. It assumed .NET could not link an archive built with wasm
      # exceptions; measured instead of assumed, .NET requires them -- its own link passes
      # -mllvm -exception-model=wasm and -lc++-except, and a throwing archive built with
      # -fwasm-exceptions links into a .NET wasm application and runs. The check was rejecting
      # the only archive that works.
      - name: Verify our own objects are single-threaded
        shell: bash
        run: |
          set -euo pipefail
          archive=build/lib/libCesiumNativeC.a
          test -f "$archive" || { echo "::error::$archive was not produced"; exit 1; }
          echo "archive: $archive ($(stat -c%s "$archive") bytes)"
          failed=0
          for sym in pthread_create; do
            count=$(grep -ac "$sym" "$archive" || true)
            printf '  %-26s %s\n' "$sym" "$count"
            if [ "$count" != "0" ]; then
              echo "::error::$archive references $sym; a .NET wasm app cannot link it as-is"
              failed=1
            fi
          done
          exit $failed

      # libCesiumNativeC.a on its own is not something a consumer can link. It holds the
      # thirteen objects of this wrapper and nothing else: cesium-native and every vcpkg
      # dependency are separate archives that CMake links at executable time, which is why the
      # tests above pass while the published asset does not work. On desktop that is invisible,
      # because the shared library resolves its own dependencies -- Windows ships nineteen DLLs
      # alongside, macOS links everything into one dylib. browser-wasm has no dynamic loading
      # at all, so whatever the package ships has to be self-contained or the consumer's link
      # fails with thousands of undefined symbols.
      #
      # Merging is done with llvm-ar's MRI script rather than emar, because emar on the Windows
      # runner is a batch wrapper and this step runs under bash.
      - name: Bundle every static library into one linkable archive
        shell: bash
        run: |
          set -euo pipefail
          ar="$EMSDK/upstream/bin/llvm-ar"
          test -x "$ar" || { echo "::error::llvm-ar not found at $ar"; exit 1; }

          # Relative, deliberately. llvm-ar is a native Windows binary and this step runs in
          # Git Bash, so an absolute $PWD reaches it as /d/a/... and it answers "no such file
          # or directory". The paths find produces are relative already, which it accepts.
          bundle="build/lib/libCesiumNativeC-bundle.a"

          # vcpkg installs each port twice, release under lib/ and debug under debug/lib/, and
          # a plain find takes both: 257 archives instead of 139, and 340 MB instead of 55. It
          # went unnoticed while the ports came from the binary cache, which does not
          # materialise the debug tree. Shipping both would also put two builds of the same
          # library in one archive and leave the consumer's linker to pick.
          find build -name '*.a' ! -path '*/debug/*' ! -path '*/libCesiumNativeC-bundle.a' \
            | sort -u > archives.txt
          if grep -q '/debug/' archives.txt; then
            echo "::error::the debug tree reached the merge list; the exclusion above no longer matches the layout"
            grep '/debug/' archives.txt
            exit 1
          fi
          count=$(wc -l < archives.txt)
          if [ "$count" -lt 2 ]; then
            echo "::error::found only $count archive(s); the dependency libraries are not where this expects them"
            cat archives.txt
            exit 1
          fi

          echo "merging $count archives:"
          awk '{ printf "  %s\n", $0 }' archives.txt

          {
            echo "create $bundle"
            while read -r a; do echo "addlib $a"; done < archives.txt
            echo "save"
            echo "end"
          } > merge.mri
          "$ar" -M < merge.mri

          test -f "$bundle" || { echo "::error::the merge produced no archive"; exit 1; }
          before=$(stat -c%s build/lib/libCesiumNativeC.a)
          after=$(stat -c%s "$bundle")
          echo "wrapper only: $before bytes"
          echo "bundled:      $after bytes  (from $count archives)"
          {
            echo "### browser-wasm archive"
            echo ""
            echo "| | bytes |"
            echo "|---|---|"
            echo "| wrapper only | $before |"
            echo "| bundled from $count archives | $after |"
          } >> "$GITHUB_STEP_SUMMARY"

          # From here on the bundle is the archive. Everything downstream -- the symbol checks
          # below, the upload, the release asset -- must see what a consumer will actually get.
          mv "$bundle" build/lib/libCesiumNativeC.a

      # Informative, not a gate. A dependency that mentions pthread_create only matters if the
      # linker actually pulls the member that mentions it, and the link below is what answers
      # that. Naming the libraries here is what turns "the bundle contains pthread_create" into
      # something actionable.
      - name: Report which dependencies mention threads
        shell: bash
        run: |
          set -euo pipefail
          # Skipping our own archive: by now the merge has renamed the bundle over it, so
          # reading it here would report the whole bundle's count as ours. Our objects are
          # checked before the merge, where the name still means what it says.
          grep -v '^build/lib/libCesiumNativeC\.a$' archives.txt > deps.txt

          # emscripten_longjmp is here for the same reason -pthread and -fwasm-exceptions are
          # checked at all: it is a third setting that has to agree across the whole link. An
          # archive built with the JS-based setjmp model cannot be linked by .NET, which passes
          # -mllvm -wasm-enable-sjlj and so expects __wasm_longjmp. That is precisely how the
          # first real consumer failed, and no test inside this repository could have said so.
          for sym in pthread_create emscripten_longjmp saveSetjmp __wasm_setjmp; do
            found=0
            while read -r a; do
              n=$(grep -ac "$sym" "$a" || true)
              if [ "$n" != "0" ]; then
                printf '  %-24s %-58s %s\n' "$sym" "$a" "$n"
                found=$((found + 1))
              fi
            done < deps.txt
            if [ "$found" = "0" ]; then
              printf '  %-24s no dependency mentions it\n' "$sym"
            fi
          done
          echo "the link below decides which of these actually matter"

      # The gate. Everything before this says what is inside the archive; only a link says
      # whether a consumer can use it.
      #
      # The program is built as C++ so emcc links the C++ runtime the archive needs, and calls
      # real entry points rather than merely naming them, so the linker has to pull the members
      # behind them -- cesium_tileset_create_from_url alone drags in most of cesium-native. No
      # -pthread and no -fwasm-exceptions, because that is how .NET links browser-wasm, and an
      # archive that needs either is one no .NET app can consume.
      - name: Link a consumer against the archive alone
        shell: bash
        run: |
          set -euo pipefail

          emcc="$EMSDK/upstream/emscripten/emcc.bat"
          if [ ! -f "$emcc" ]; then
            emcc="$EMSDK/upstream/emscripten/emcc"
          fi
          test -f "$emcc" || { echo "::error::no emcc found under $EMSDK/upstream/emscripten"; exit 1; }
          echo "using $emcc"

          mkdir -p linkcheck
          cat > linkcheck/consumer.cpp <<'CONSUMER'
          #include <cesium/cesium_common.h>
          #include <cesium/cesium_tileset.h>
          #include <cesium/cesium_gltf.h>
          #include <cesium/cesium_ion.h>

          int main() {
              CesiumAsyncSystem* async = cesium_async_system_create();
              CesiumAssetAccessorCallbacks cb{};
              CesiumAssetAccessor* accessor = cesium_asset_accessor_create_from_callbacks(&cb);
              CesiumCreditSystem* credits = cesium_credit_system_create();
              CesiumTilesetExternals* externals =
                  cesium_tileset_externals_create(async, accessor, credits);

              CesiumTilesetOptions* options = cesium_tileset_options_create();
              CesiumTileset* tileset =
                  cesium_tileset_create_from_url(externals, "https://example.invalid/t.json", options);
              cesium_async_system_dispatch_main_thread_tasks(async);

              CesiumCGltfReader* reader = cesium_gltf_reader_create();
              cesium_gltf_reader_destroy(reader);

              cesium_tileset_destroy(tileset);
              cesium_tileset_options_destroy(options);
              cesium_tileset_externals_destroy(externals);
              cesium_credit_system_destroy(credits);
              cesium_asset_accessor_destroy(accessor);
              cesium_async_system_destroy(async);
              return 0;
          }
          CONSUMER

          link_against() {
            local archive="$1" tag="$2"
            rm -rf "linkcheck/$tag"
            mkdir -p "linkcheck/$tag"
            # Plain emcc, no ABI flags. This check cannot be made faithful to .NET by guessing
            # flags -- it was tried, twice, and both times it agreed with itself while the real
            # consumer failed. The faithful check is the .NET publish further down; this one is
            # only here to catch an archive that is missing symbols outright.
            "$emcc" linkcheck/consumer.cpp "$archive" \
              -I include \
              -o "linkcheck/$tag/consumer.js" \
              2>&1 | tee "linkcheck/$tag.log"
            test -f "linkcheck/$tag/consumer.wasm" || {
              echo "::error::linking against $archive produced no wasm module"; return 1; }
            "$EMSDK_NODE" "linkcheck/$tag/consumer.js"
            stat -c%s "linkcheck/$tag/consumer.wasm"
          }

          # The gate, against exactly what the upload step ships.
          asis=$(stat -c%s build/lib/libCesiumNativeC.a)
          wasm_asis=$(link_against build/lib/libCesiumNativeC.a asis | tail -1)
          echo "as shipped: archive $asis -> wasm $wasm_asis, and it ran"

          # The --strip-debug measurement that used to live here is gone. It was asked once and
          # answered: zero bytes, because a Release build carries no DWARF. Keeping it around
          # bought nothing and then broke the job outright, on
          # "'casts.cc.o': invalid relocation offset" from one abseil object -- taking down the
          # .NET check below, which is the only one that decides anything.
          {
            echo ""
            echo "| archive | bytes | linked wasm |"
            echo "|---|---|---|"
            echo "| as shipped | $asis | $wasm_asis |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The check that matters, and the one that was missing. Everything above describes the
      # archive; only .NET can say whether .NET can use it, and the two times this job tried to
      # answer that with emcc flags it said yes while the real consumer said no. Three separate
      # blockers were found by a person running a .NET publish by hand and none by this job:
      # setjmp from turbojpeg, the wasm exception model, and non-trapping float-to-int.
      #
      # It also covers the step after linking. wasm-opt runs with a fixed feature list here, and
      # an archive can link cleanly and still fail validation, which is exactly how
      # -mnontrapping-fptoint surfaced.
      - name: Setup .NET for the consumer check
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install the wasm workload
        run: dotnet workload install wasm-tools

      - name: Publish a .NET wasm application against the archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dotnetcheck

          # Named after the DllImport, not after what CMake produced. The module name comes from
          # the file name, which is why the package renames it too.
          cp build/lib/libCesiumNativeC.a dotnetcheck/CesiumNativeC.a

          cat > dotnetcheck/Check.csproj <<'PROJ'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <RuntimeIdentifier>browser-wasm</RuntimeIdentifier>
              <OutputType>Exe</OutputType>
              <WasmMainJSPath>main.mjs</WasmMainJSPath>
              <WasmBuildNative>true</WasmBuildNative>
              <InvariantGlobalization>true</InvariantGlobalization>
            </PropertyGroup>
            <ItemGroup>
              <NativeFileReference Include="CesiumNativeC.a" ScanForPInvokes="true" />
            </ItemGroup>
          </Project>
          PROJ

          cat > dotnetcheck/main.mjs <<'MJS'
          import { dotnet } from './_framework/dotnet.js'
          const { runMain } = await dotnet.create();
          process.exit(await runMain());
          MJS

          cat > dotnetcheck/Program.cs <<'CS'
          using System;
          using System.Runtime.InteropServices;

          internal static class Program
          {
              const string Lib = "CesiumNativeC";

              [DllImport(Lib)] static extern IntPtr cesium_async_system_create();
              [DllImport(Lib)] static extern void cesium_async_system_destroy(IntPtr h);
              [DllImport(Lib)] static extern void cesium_async_system_dispatch_main_thread_tasks(IntPtr h);
              [DllImport(Lib)] static extern IntPtr cesium_credit_system_create();
              [DllImport(Lib)] static extern IntPtr cesium_asset_accessor_create_from_callbacks(IntPtr cb);
              [DllImport(Lib)] static extern IntPtr cesium_tileset_externals_create(IntPtr a, IntPtr b, IntPtr c);
              [DllImport(Lib)] static extern IntPtr cesium_tileset_options_create();
              [DllImport(Lib)] static extern IntPtr cesium_tileset_create_from_url(IntPtr e, [MarshalAs(UnmanagedType.LPUTF8Str)] string url, IntPtr o);
              [DllImport(Lib)] static extern IntPtr cesium_gltf_reader_create();

              static int Main()
              {
                  // Calls rather than references, so the linker has to pull the members behind
                  // them. cesium_tileset_create_from_url alone drags in most of cesium-native.
                  IntPtr async = cesium_async_system_create();
                  IntPtr credits = cesium_credit_system_create();
                  IntPtr reader = cesium_gltf_reader_create();
                  IntPtr options = cesium_tileset_options_create();

                  var callbacks = new byte[64];
                  GCHandle pin = GCHandle.Alloc(callbacks, GCHandleType.Pinned);
                  IntPtr accessor = cesium_asset_accessor_create_from_callbacks(pin.AddrOfPinnedObject());
                  IntPtr externals = cesium_tileset_externals_create(async, accessor, credits);
                  IntPtr tileset = cesium_tileset_create_from_url(externals, "https://fake.test/t.json", options);
                  cesium_async_system_dispatch_main_thread_tasks(async);
                  pin.Free();

                  bool ok = async != IntPtr.Zero && credits != IntPtr.Zero && reader != IntPtr.Zero
                            && accessor != IntPtr.Zero && externals != IntPtr.Zero && tileset != IntPtr.Zero;

                  Console.WriteLine($"async=0x{async:x} accessor=0x{accessor:x} tileset=0x{tileset:x}");
                  cesium_async_system_destroy(async);
                  Console.WriteLine(ok ? "PASS" : "FAIL");
                  return ok ? 0 : 1;
              }
          }
          CS

          dotnet publish dotnetcheck/Check.csproj -c Release
          node dotnetcheck/bin/Release/net10.0/browser-wasm/AppBundle/main.mjs
          echo "a .NET wasm application linked this archive and ran it"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CesiumNativeC-browser-wasm
          path: build/lib/libCesiumNativeC.a
          if-no-files-found: error

  # ── Release ─────────────────────────────────────────────────────────────
  # Artifacts expire after 90 days; release assets do not. Without this, the only way a
  # binary reaches Cesium.NET is somebody downloading it by hand, and nothing records which
  # revision it came from -- which is exactly how that repository ended up with three RIDs
  # and no account of where they came from.
  release:
    needs: [build, wasm]
    if: inputs.release-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Collect the built libraries
        uses: actions/download-artifact@v5
        with:
          pattern: CesiumNativeC-*
          path: assets

      # Each archive holds runtimes/<rid>/native/, so a consumer unpacks it over its tree and
      # is done.
      #
      # The per-platform file selection is explicit rather than a copy of everything, for two
      # reasons. The Linux and macOS artifacts also contain CesiumNativeCTests, the test
      # executable, which has no business in a package. And "copy whatever is there" cannot
      # tell the difference between a platform that shipped its library and one that shipped
      # only a stray file, so it would happily publish the second.
      - name: Pack one archive per runtime identifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          shopt -s nullglob

          pack() {
            local artifact=$1 rid=$2 subdir=$3 pattern=$4 required=$5
            local src="assets/CesiumNativeC-$artifact/$subdir"
            local dest="staging/$rid/runtimes/$rid/native"

            # Matches collected and filtered to what exists, so an empty match is reported as
            # what it is. Letting `cp` discover it produces "cannot stat" or "missing
            # destination file operand" depending on whether the pattern was a glob, and
            # neither says which platform failed. Filtering by existence rather than relying on
            # nullglob because half these patterns are literal filenames, which nullglob leaves
            # in the array whether the file is there or not.
            local matches=() candidate
            for candidate in $src$pattern; do
              [ -e "$candidate" ] && matches+=("$candidate")
            done
            if [ ${#matches[@]} -eq 0 ]; then
              echo "::error::$rid: nothing matched $src$pattern -- the $artifact build produced no library"
              exit 1
            fi

            mkdir -p "$dest"
            cp "${matches[@]}" "$dest/"

            if [ ! -f "$dest/$required" ]; then
              echo "::error::$rid: $required not found among $(ls "$dest" | tr '\n' ' ')"
              exit 1
            fi

            ( cd "staging/$rid" && zip -qr "$GITHUB_WORKSPACE/release/cesiumnativec-$rid.zip" runtimes )
            echo "packed cesiumnativec-$rid.zip  ($(find "$dest" -type f | wc -l) file(s))"
          }

          # Windows links its dependencies dynamically, so the package is CesiumNativeC.dll
          # plus the nineteen it needs. Linux and macOS link everything statically into one
          # library. Both are deliberate, and the coherence checks read them the same way.
          pack windows-x64    win-x64      bin/Release/ '*.dll'                CesiumNativeC.dll
          pack windows-arm64  win-arm64    bin/Release/ '*.dll'                CesiumNativeC.dll
          pack linux-x64      linux-x64    bin/         'libCesiumNativeC.so'  libCesiumNativeC.so
          pack linux-arm64    linux-arm64  bin/         'libCesiumNativeC.so'  libCesiumNativeC.so
          pack osx-arm64      osx-arm64    bin/         'libCesiumNativeC.dylib' libCesiumNativeC.dylib
          pack android-arm64  android-arm64 bin/        'libCesiumNativeC.so'  libCesiumNativeC.so
          pack ios-arm64      ios-arm64    lib/         'libCesiumNativeC.a'   libCesiumNativeC.a
          pack iossimulator-arm64 iossimulator-arm64 lib/ 'libCesiumNativeC.a'   libCesiumNativeC.a
          pack browser-wasm   browser-wasm ''           'libCesiumNativeC.a'   libCesiumNativeC.a

          echo
          ls -la release/
          count=$(ls release/*.zip | wc -l)
          if [ "$count" -ne 9 ]; then
            echo "::error::expected 9 archives, got $count. A platform is missing."
            exit 1
          fi

      # The tag names the cesium-native release this wrapper targets, so it has to be the one
      # the manifest records. A release tagged v0.63.0 built from a tree pinned at v0.61.0 is
      # a lie that only shows up much later, in a consumer.
      - name: Check the tag matches what the manifest records
        shell: bash
        run: |
          set -euo pipefail
          recorded=$(python3 -c "import yaml,sys; print(((yaml.safe_load(open('binding.yml',encoding='utf-8')).get('upstream') or {}).get('release') or {}).get('current') or '')")
          echo "manifest records: $recorded"
          echo "release tag:      ${{ inputs.release-tag }}"
          if [ "$recorded" != "${{ inputs.release-tag }}" ]; then
            echo "::error::binding.yml records $recorded but this release is tagged ${{ inputs.release-tag }}."
            exit 1
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release-tag }}
          name: ${{ inputs.release-tag }}
          body: |
            CesiumNativeC wrapping cesium-native `${{ inputs.release-tag }}`.

            Nine archives, one per runtime identifier. Each contains
            `runtimes/<rid>/native/`, so unpacking it over a .NET binding repository puts the
            library where the package expects it.

            `browser-wasm` is a single static archive with cesium-native and its dependencies
            merged in, built without `-pthread` and without `-mnontrapping-fptoint`, which is
            what .NET's browser-wasm can link. It carries no `setjmp`, which .NET resolves in
            no form. A .NET wasm application links it and runs it in this repository's CI.

            `android-arm64` is an ordinary shared library with its thirty dependencies linked
            in, built against NDK API 28. There is no 32-bit `android-arm`: Google Play has
            required 64-bit since 2019.

            `ios-arm64` and `iossimulator-arm64` are static archives with everything merged in,
            because iOS only lets an application load dynamic libraries that ship inside its own
            bundle. They carry no `asmjit`: iOS forbids JIT, and blend2d is built without it.

            HTTP is supplied by the host through `cesium_asset_accessor_create_from_callbacks`,
            so a .NET application serves requests with `HttpClient` and the tileset loads on the
            web.
          files: release/*.zip
          fail_on_unmatched_files: true

      # The binding repositories used to find out from a monthly cron that fires the day before
      # this repository's porter agent runs, so a version took two months to reach a package
      # rather than one. They are told directly now. Who they are is declared in binding.yml.
      - name: Tell the bindings a release exists
        uses: EvergineTeam/Evergine.Bindings/.github/actions/notify-downstream@v1
        with:
          app-client-id: ${{ vars.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          tag: ${{ inputs.release-tag }}
